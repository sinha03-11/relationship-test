<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartSync | Relationship Quality Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .progress-bar { transition: width 0.4s ease-in-out; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8 text-white">
            <h1 class="text-4xl font-bold mb-2">HeartSync</h1>
            <p class="opacity-90">An honest reflection on your connection.</p>
        </header>

        <div id="quiz-card" class="glass p-6 md:p-10 fade-in">
            <div class="w-full bg-gray-200 rounded-full h-2 mb-8">
                <div id="progress" class="bg-indigo-600 h-2 rounded-full progress-bar" style="width: 5%"></div>
            </div>

            <div id="question-container">
                <span id="question-number" class="text-indigo-600 font-semibold uppercase tracking-wider text-sm">Question 1 of 20</span>
                <h2 id="question-text" class="text-2xl font-bold text-gray-800 mt-2 mb-8 leading-tight">Do you feel safe expressing your most "random" or difficult emotions without judgment?</h2>
                
                <div class="space-y-4">
                    <button onclick="handleAnswer(true)" class="w-full py-4 px-6 text-left border-2 border-gray-100 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium flex justify-between items-center group">
                        Yes, absolutely. <span class="opacity-0 group-hover:opacity-100 text-indigo-500">→</span>
                    </button>
                    <button onclick="handleAnswer(false)" class="w-full py-4 px-6 text-left border-2 border-gray-100 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium flex justify-between items-center group">
                        No, not really. <span class="opacity-0 group-hover:opacity-100 text-indigo-500">→</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="result-card" class="glass p-6 md:p-10 fade-in hidden text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Your Relationship Score</h2>
            <div class="relative inline-block my-8">
                <svg class="w-40 h-40">
                    <circle class="text-gray-200" stroke-width="10" stroke="currentColor" fill="transparent" r="70" cx="80" cy="80"/>
                    <circle id="score-circle" class="text-indigo-600" stroke-width="10" stroke-dasharray="440" stroke-dashoffset="440" stroke-linecap="round" stroke="currentColor" fill="transparent" r="70" cx="80" cy="80"/>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span id="score-text" class="text-4xl font-bold text-indigo-600">0%</span>
                </div>
            </div>
            <p id="analysis-text" class="text-gray-600 mb-8 leading-relaxed px-4"></p>
            
            <div class="flex flex-col gap-4">
                <button onclick="copyLink()" class="bg-indigo-600 text-white py-4 px-8 rounded-xl font-bold hover:bg-indigo-700 transition-all">
                    Share My Result Link
                </button>
                <button onclick="location.reload()" class="text-gray-500 font-medium hover:text-indigo-600">Retake Quiz</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            "Do you feel safe expressing your most 'random' or difficult emotions?",
            "Do you feel your partner puts in as much effort as you do to keep the spark alive?",
            "Does your partner truly understand your 'love language'?",
            "Do you feel like you can be 100% yourself when you are around them?",
            "In a conflict, is the goal to find a solution rather than to 'win' the argument?",
            "Do you feel appreciated for the small things you do every day?",
            "Is there a high level of trust when you are not physically together?",
            "Does your partner actively listen when you share your day?",
            "Do you still feel 'butterflies' or a sense of excitement occasionally?",
            "Is your partner the first person you want to talk to when something goes wrong?",
            "Do you feel your personal growth is encouraged rather than restricted?",
            "Do you find it easy to apologize when you've made a mistake?",
            "Does your partner make an effort to get along with your friends or family?",
            "Are your long-term life goals (kids, career, travel) generally aligned?",
            "Do you feel emotionally satisfied after spending time together?",
            "Is physical affection a regular part of your daily routine?",
            "Do you feel like your partner 'has your back' in public situations?",
            "Can you sit in comfortable silence together without feeling awkward?",
            "Do you feel that you are a better person because of this relationship?",
            "If you had to start all over, would you choose this same person again?"
        ];

        let currentQuestion = 0;
        let score = 0;

        function handleAnswer(isYes) {
            if(isYes) score++;
            currentQuestion++;

            if(currentQuestion < questions.length) {
                updateQuestion();
            } else {
                showResults();
            }
        }

        function updateQuestion() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;
            document.getElementById('question-number').innerText = `Question ${currentQuestion + 1} of 20`;
            document.getElementById('question-text').innerText = questions[currentQuestion];
        }

        function showResults() {
            const percentage = (score / questions.length) * 100;
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            
            // Animate Circle
            const circle = document.getElementById('score-circle');
            const offset = 440 - (440 * percentage) / 100;
            circle.style.strokeDashoffset = offset;
            document.getElementById('score-text').innerText = `${percentage}%`;

            // Dynamic Analysis
            let analysis = "";
            if(percentage >= 80) analysis = "Your relationship is built on a rock-solid foundation of trust and mutual effort. You have a rare and beautiful connection.";
            else if(percentage >= 50) analysis = "You have a healthy bond, but there are areas where deeper understanding and more consistent effort could help you flourish.";
            else analysis = "It seems you're navigating some tough waters. This might be a good time for an open, honest conversation about your needs and feelings.";
            
            document.getElementById('analysis-text').innerText = analysis;
        }

        function copyLink() {
            const dummyLink = `https://heartsync.app/results?score=${(score/20)*100}`;
            navigator.clipboard.writeText(dummyLink);
            alert("Result link copied to clipboard!");
        }
    </script>
</body>
</html>
